# Desarrollado por Jose Eduardo Romero Jimenez
# https://github.com/Edunzz
#
# Valida los documentos, ejecuta las pruebas, genera el manifiesto con los
# datos de ESTE repositorio (GITHUB_REPOSITORY, GITHUB_SHA, GITHUB_REF_NAME) y
# publica el sitio estático en GitHub Pages.
#
# Requisito único: Settings → Pages → Source: «GitHub Actions».
# Las acciones están fijadas por SHA (con su versión en el comentario) y
# Dependabot las mantiene al día (.github/dependabot.yml).

name: Publicar documentación en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Validar, probar y construir
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Instalar dependencias (reproducible, desde package-lock.json)
        run: npm ci

      - name: Empaquetar librerías del navegador e iconos
        run: npm run vendor

      - name: Validar documentos
        run: npm run validate

      - name: Generar documents.manifest.json
        run: npm run manifest
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Comprobar enlaces internos
        run: npm run check:links

      - name: Pruebas automatizadas
        run: npm test

      - name: Construir el sitio estático
        run: npm run build:site

      - name: Subir el artefacto de Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Desplegar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
