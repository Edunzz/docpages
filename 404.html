<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>404 · Página no encontrada · Page not found</title>
    <!--
      GitHub Pages sirve este archivo para cualquier ruta inexistente, en la URL
      pedida. Por eso todo va en línea: las rutas relativas no serían fiables.
      1. /{base}/steps/{slug} o /{base}/tests/{slug} → redirige a #/steps/{slug}.
      2. Si no, ofrece volver al inicio del sitio: prueba si el primer segmento
         de la ruta es un sitio de proyecto (tiene documents.manifest.json).
    -->
    <style>
      :root { color-scheme: light dark; --bg: #f5f7fb; --fg: #0f172a; --muted: #475569; --accent: #3046c9; --card: #ffffff; --border: #dde3ee; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0b1020; --fg: #e8ecf6; --muted: #a9b3c9; --accent: #9aa8ff; --card: #121a2e; --border: #263252; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { max-width: 34rem; width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; box-shadow: 0 10px 30px rgb(15 23 42 / 0.08); }
      .code { font-size: 3rem; font-weight: 800; margin: 0; color: var(--accent); letter-spacing: -0.03em; }
      h1 { font-size: 1.35rem; margin: 0.25rem 0 0.5rem; }
      p { color: var(--muted); margin: 0.25rem 0; }
      a { display: inline-block; margin-top: 1.25rem; padding: 0.6rem 1.1rem; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 600; text-decoration: none; }
      @media (prefers-color-scheme: dark) { a { color: #0b1020; } }
      a:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code" aria-hidden="true">404</p>
      <h1>Página no encontrada · Page not found</h1>
      <p>La dirección no existe en este sitio.</p>
      <p lang="en">This address does not exist on this site.</p>
      <a id="home" href="/">Ir al inicio · Go home</a>
    </main>
    <script>
      (function () {
        var path = window.location.pathname;
        var match = path.match(/^(.*?\/)(steps|tests)\/([a-z0-9-]+)\/?$/);
        if (match) {
          window.location.replace(match[1] + "#/" + match[2] + "/" + match[3]);
          return;
        }
        var link = document.getElementById("home");
        var first = path.split("/").filter(Boolean)[0];
        if (!first) return;
        var candidate = "/" + first + "/";
        link.href = candidate;
        if (window.fetch) {
          fetch(candidate + "documents.manifest.json", { method: "HEAD" })
            .then(function (res) { link.href = res.ok ? candidate : "/"; })
            .catch(function () { link.href = "/"; });
        }
      })();
    </script>
  </body>
</html>
